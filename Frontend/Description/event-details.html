<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Event Details</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../common/styles.css">
</head>

<body>

    <button onclick="history.back()" class="floating-back-btn">
        <i class="bi bi-arrow-left"></i> Back
    </button>

    <div class="sidebar-image-container" id="eventLogo"></div>

    <div class="container">
        <!-- 2. STEPPER -->
        <div class="stepper-container">
            <div class="stepper">
                <div class="step active">
                    <div class="circle">1</div>
                    <span class="step-label">Description</span>
                </div>
                <div class="step activein">
                    <div class="circle">2</div>
                    <span class="step-label">Registration</span>
                </div>
                <div class="step activein">
                    <div class="circle">3</div>
                    <span class="step-label">Confirmation</span>
                </div>
            </div>
        </div>

        <!-- 3. DESCRIPTION CONTENT -->
        <div class="content" id="content">
            <div class="event-card">
                <h2 id="eventTitle">Loading...</h2>
                <p class="lead" id="eventTagline"></p>

                <div class="vent">
                    <h3 id="eventVenue"><i class="bi bi-geo-alt-fill"></i> Loading...</h3>
                    <h3 id="eventTime"><i class="bi bi-clock-fill"></i> Loading...</h3>
                </div>

                <h4>Description:</h4>
                <p id="eventDesc">Loading description...</p>

                <h5>Rules:</h5>
                <ul id="eventRules">
                    <!-- Rules will be injected here -->
                </ul>

                <div id="eventTopicsContainer" style="display: none;">
                    <h5>Topics:</h5>
                    <ol id="eventTopics">
                        <!-- Topics will be injected here -->
                    </ol>
                </div>

                <div class="register-btn">
                    <button class="btn btn-secondary" onclick="history.back()">Back</button>
                    <button id="registerBtn" class="btn btn-primary">Register Now</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../common/main.js"></script>
    <script>
        // Init
        document.addEventListener('DOMContentLoaded', loadEventDetails);
    </script>
</body>

</html>
