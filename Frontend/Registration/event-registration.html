<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Event Registration</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../common/styles.css">
    <style>
        /* Specific override for background image on registration page */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: var(--event-bg);
            /* Dynamic Variable */
            background-size: cover;
            opacity: 0.15;
            /* Subtle background */
            z-index: -1;
        }
    </style>
</head>

<body>

    <div class="stepper-container">
        <div class="stepper">
            <div class="step completed">
                <div class="circle">✓</div>
                <span class="step-label">Description</span>
            </div>
            <div class="step active">
                <div class="circle">2</div>
                <span class="step-label">Registration</span>
            </div>
            <div class="step activein">
                <div class="circle">3</div>
                <span class="step-label">Confirmation</span>
            </div>
        </div>
    </div>

    <div class="content">
        <div class="container event-card"> <!-- repurpose container styles -->
            <div class="form">
                <h2 id="eventTitle">Event Registration</h2>
                <form id="eventForm" onsubmit="return false;">

                    <!-- Dynamic fields will be injected here -->
                    <div id="participantsContainer"></div>

                    <!-- Common Fields -->
                    <div style="margin-top: 20px;">
                        <label>Mobile Number:</label>
                        <input type="tel" placeholder="10-digit mobile" id="mobile" required>
                        <div class="error-message" id="error-mobile"></div>
                    </div>

                    <div>
                        <label>College Name:</label>
                        <input type="text" placeholder="College/Organization" id="college" required>
                        <div class="error-message" id="error-college"></div>
                    </div>

                    <div>
                        <label>Course:</label>
                        <select id="course" required>
                            <option value="" disabled selected>Select Course</option>
                            <option>BCA</option>
                            <option>BCom</option>
                            <option>MBA</option>
                            <option>BBA</option>
                            <option>B.Tech</option>
                            <option>B.Sc</option>
                        </select>
                        <div class="error-message" id="error-course"></div>
                    </div>

                    <div>
                        <label>City:</label>
                        <select id="city" required>
                            <option value="" disabled selected>Select City</option>
                            <option>Thoothukudi</option>
                            <option>Tirunelveli</option>
                            <option>Madurai</option>
                            <option>Nagercoil</option>
                            <option>Chennai</option>
                            <option>Other</option>
                        </select>
                        <div class="error-message" id="error-city"></div>
                    </div>

                    <div class="register-btn">
                        <button type="button" class="btn btn-secondary" onclick="history.back()">Back</button>
                        <button type="button" id="registerBtn" class="btn btn-primary"
                            onclick="validateAndSubmit()">Submit</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="../common/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', loadRegistrationPage);
    </script>
</body>

</html>
